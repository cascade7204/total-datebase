
name: Deploy site with preview

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop-site

      - name: Assemble site
        run: |
          mkdir -p site/preview
          rsync -a --exclude='.git' --exclude='.github' main-site/ site/
          rsync -a --exclude='.git' --exclude='.github' develop-site/ site/preview/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
