name: Weekly ekiden import

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python update.py --out output
      - uses: actions/upload-artifact@v4
        with:
          name: ekiden-database
          path: output/
          retention-days: 30
