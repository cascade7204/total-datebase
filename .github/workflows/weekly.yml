name: Weekly ekiden import

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python update.py --out output
      - name: Update website data
        run: |
          mkdir -p data
          cp output/results.csv data/results.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update ekiden results"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ekiden-database
          path: output/
          retention-days: 30
