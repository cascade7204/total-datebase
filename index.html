<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>陸上競技データベース（開発版）</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f6f8;color:#202632;margin:0}header{background:#183b62;color:#fff;padding:22px 16px}header>div,main{max-width:1050px;margin:auto}h1{font-size:22px;margin:0 0 5px}header p{margin:0;opacity:.85;font-size:13px}main{padding:18px 14px}.panel{background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:17px;margin-bottom:15px}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:600;display:block}input,select{width:100%;font:inherit;font-size:15px;margin-top:5px;padding:11px;border:1px solid #cbd3dd;border-radius:8px;background:white}button{font:inherit;cursor:pointer;border-radius:8px;padding:10px 15px;border:1px solid #bdc8d5;background:white;color:#183b62}button.primary{background:#183b62;color:white;border-color:#183b62}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #82b5ee}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;margin-top:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button[aria-selected=true]{background:#183b62;color:#fff}.muted{color:#5d6a7b;font-size:13px}.notice{background:#fff8e6;border:1px solid #efd9a0;border-radius:8px;padding:12px;font-size:13px;margin-bottom:14px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px 10px;border-bottom:1px solid #e7ebef;text-align:left;white-space:nowrap}th{background:#f1f4f8;color:#39495d}td button{padding:3px 0;border:0;background:transparent;text-decoration:underline;color:#174b7c;text-align:left}.record{margin-top:8px;padding:9px;background:#f5f7fa;border-radius:6px}.detail h2{font-size:19px;margin:0 0 10px}.detail h3{font-size:15px;margin:16px 0 6px}.footer{margin:12px 0;display:flex;gap:12px;align-items:center}.empty{padding:24px;text-align:center;color:#68778a}.race-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.race-tabs button[aria-selected="true"]{background:#183b62;color:#fff}.expand-row td{background:#f7f9fc;white-space:normal}.expand-row table{background:#fff}.mobile{display:none}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.subtabs button[aria-selected="true"]{background:#183b62;color:white}.linklike{border:0;background:none;padding:2px;color:#174b7c;text-decoration:underline}.hint{font-size:13px;color:#5d6a7b;margin:9px 0}.detail-nav{display:flex;gap:10px;margin-bottom:14px}.detail-nav button{font-weight:600}
@media(max-width:640px){.filters{grid-template-columns:1fr}.desktop{display:none}.mobile{display:block}.entry{border-bottom:1px solid #e7ebef;padding:13px 0}.entry button{border:0;padding:0;text-decoration:underline;font-weight:600}.entry .muted{margin-top:5px}.panel{padding:13px}h1{font-size:20px}}
</style></head><body>
<header><div><h1>陸上競技データベース</h1><p>選手・チーム・大会記録を検索（開発版）</p></div></header>
<main>
<div class="notice">開発版：2025・2026年の全日本大学駅伝のみ収録。選手IDは区間記録ごとの仮IDで、同一人物の統合は未実施です。総合順位は未確認のため表示しません。総合タイムは暫定値です。</div>
<div id="search-view"><section class="panel"><form id="form"><div class="filters">
<label>選手名<input id="athlete" type="search" placeholder="選手名"></label>
<label>チーム名<input id="team" type="search" placeholder="大学名"></label>
<label>大会<select id="race"><option value="">すべて</option></select></label>
<label>年度<select id="year"><option value="">すべて</option></select></label>
</div><div class="actions"><button class="primary" type="submit">検索</button><button type="button" id="reset">条件をクリア</button></div></form></section>
<section class="panel"><div id="status" class="muted" role="status">データを読み込み中...</div>
<div class="tabs" role="tablist" aria-label="検索結果の種類">
<button type="button" data-tab="athletes" role="tab" aria-selected="true">選手</button>
<button type="button" data-tab="teams" role="tab" aria-selected="false">チーム</button>
<button type="button" data-tab="results" role="tab" aria-selected="false">大会記録</button>
</div><div id="listing"></div><div class="footer"><button type="button" id="more" hidden>さらに20件表示</button></div></section>
</div><section class="panel detail" id="detail" hidden></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let data={},tab='athletes',limit=20,matched=[],criteria={};
let view={kind:'search'}, restoring=false;
const allowedKinds=new Set(['search','athlete','team','race']);
function parseHash(){
 const match=location.hash.match(/^#\/(search|athlete|team|race)(?:\/([^/?#]+))?$/);
 if(!match)return {kind:'search'};
 const kind=match[1];if(kind==='search')return {kind};
 try{return {kind,id:decodeURIComponent(match[2]||'')}}catch{return {kind:'search'}}
}
function routeUrl(next){return next.kind==='search'?'#/search':`#/${next.kind}/${encodeURIComponent(next.id)}`}
function showSearch(){
 $('search-view').hidden=false;$('detail').hidden=true;
}
function route(next,record=true){
 if(!allowedKinds.has(next.kind))return;
 if(view.kind==='search')history.replaceState({...history.state,view:{kind:'search'},scrollY:window.scrollY},'',location.href);
 view=next;
 if(record&&!restoring)history.pushState({view:next},'',routeUrl(next));
 drawView();
 if(next.kind!=='search')window.scrollTo(0,0);
}
function drawView(){
 if(view.kind==='search'){showSearch();return}
 $('search-view').hidden=true;
 $('detail').hidden=false;
 if(view.kind==='athlete')renderAthlete(view.id);
 else if(view.kind==='team')renderTeam(view.id);
 else if(view.kind==='race')showRace(view.id);
}
function detailShell(title){
 const box=$('detail');box.replaceChildren();
 const nav=el('div','','detail-nav'),back=el('button','← 検索結果に戻る');back.type='button';
 back.onclick=()=>route({kind:'search'});
 nav.append(back);box.append(nav,el('h2',title));box.hidden=false;return box;
}
function showMissing(){const box=detailShell('記録が見つかりません');box.append(el('p','指定された記録は現在のデータにありません。','muted'));}
function linkedButton(label,fn){const b=el('button',label,'linklike');b.type='button';b.onclick=fn;return b;}
function linkedTable(headers,rows){const wrap=el('div','','tablewrap'),table=el('table'),head=el('tr');headers.forEach(h=>head.append(el('th',h)));const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');rows.forEach(cells=>{const tr=el('tr');cells.forEach(c=>{const td=el('td');if(c&&typeof c==='object'&&c.nodeType)td.append(c);else td.textContent=String(c??'—');tr.append(td)});tbody.append(tr)});table.append(tbody);wrap.append(table);return wrap;}
function athleteLink(id){return linkedButton(nameBy(data.athletes,id),()=>route({kind:'athlete',id}));}
function teamLink(id){return linkedButton(nameBy(data.teams,id),()=>route({kind:'team',id}));}
function raceLink(id,label){return linkedButton(label,()=>route({kind:'race',id}));}
const escapeText=x=>String(x??'');
const nameBy=(list,id)=>list.find(x=>x.id===id)?.name||'不明';
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(cls)x.className=cls;x.textContent=escapeText(text);return x};
function filteredPerformances(){return data.performances.filter(p=>{
 const athlete=nameBy(data.athletes,p.athlete_id),team=nameBy(data.teams,p.team_id);
 return (!criteria.athlete||athlete.toLocaleLowerCase().includes(criteria.athlete))&&
 (!criteria.team||team.toLocaleLowerCase().includes(criteria.team))&&
 (!criteria.race||p.race===criteria.race)&&(!criteria.year||String(p.year)===criteria.year);
});}
function search(){criteria={athlete:$('athlete').value.trim().toLocaleLowerCase(),team:$('team').value.trim().toLocaleLowerCase(),race:$('race').value,year:$('year').value};
 tab=criteria.athlete?'athletes':criteria.team?'teams':criteria.race||criteria.year?'results':'athletes';limit=20;render();}
function render(){const perf=filteredPerformances();const ids=new Set(perf.map(x=>x.athlete_id));const teamids=new Set(perf.map(x=>x.team_id));const trids=new Set(perf.map(x=>x.team_race_id));
 matched=tab==='athletes'?data.athletes.filter(x=>ids.has(x.id)).map(x=>({kind:'athlete',...x})):tab==='teams'?data.teams.filter(x=>teamids.has(x.id)).map(x=>({kind:'team',...x})):data.team_results.filter(x=>trids.has(x.id)).map(x=>({kind:'result',...x}));
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
 $('status').textContent=`${matched.length}件（${Math.min(limit,matched.length)}件表示）／該当する区間記録 ${perf.length}件`;
 const list=$('listing');list.replaceChildren();const shown=matched.slice(0,limit);
 if(!shown.length)list.append(el('div','該当する記録がありません','empty'));
 else{const wrap=el('div','','desktop tablewrap'),table=el('table'),thead=el('thead'),head=el('tr');
 const cols=tab==='athletes'?['選手名','所属（出走時）','年度']:tab==='teams'?['チーム名','区分','都道府県']:['年度','大会','チーム','順位','記録'];
 cols.forEach(c=>head.append(el('th',c)));thead.append(head);table.append(thead);const tbody=el('tbody');
 shown.forEach(x=>{const tr=el('tr');const values=rowValues(x);values.forEach((v,i)=>{const td=el('td');if(i===0||tab==='results'&&i===2){const b=el('button',v);b.type='button';b.addEventListener('click',()=>route(x.kind==='result'?{kind:'race',id:x.race_id}:{kind:x.kind,id:x.id}));td.append(b)}else td.textContent=v;tr.append(td)});tbody.append(tr)});table.append(tbody);wrap.append(table);list.append(wrap);
 const mobile=el('div','','mobile');shown.forEach(x=>{const item=el('div','','entry'),vals=rowValues(x),b=el('button',tab==='results'?`${vals[0]} ${vals[1]} / ${vals[2]}`:vals[0]);b.type='button';b.addEventListener('click',()=>route(x.kind==='result'?{kind:'race',id:x.race_id}:{kind:x.kind,id:x.id}));item.append(b);item.append(el('div',vals.slice(tab==='results'?3:1).join(' / '),'muted'));mobile.append(item)});list.append(mobile)}
 $('more').hidden=matched.length<=limit;
}
function rowValues(x){if(x.kind==='athlete'){
 const p=data.performances.find(p=>p.athlete_id===x.id);return [x.name,p?nameBy(data.teams,p.team_id):'—',p?String(p.year):'—'];}
 if(x.kind==='team')return [x.name,x.category||'—','—'];
 return [String(x.year),x.race,nameBy(data.teams,x.team_id),'—',x.overall_time?x.overall_time+'（暫定）':'—'];}
function secs(t){if(!t)return Number.POSITIVE_INFINITY;const a=String(t).split(':').map(Number);return a.reduce((s,n)=>s*60+n,0)}
function makeTable(headers,rows){const wrap=el('div','','tablewrap'),table=el('table'),thead=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th',h)));thead.append(tr);table.append(thead);const body=el('tbody');rows.forEach(row=>{const tr=el('tr');row.forEach(v=>tr.append(el('td',v)));body.append(tr)});table.append(body);wrap.append(table);return wrap}
function showRace(raceId){
 const race=data.races.find(r=>String(r.id)===String(raceId));if(!race){showMissing();return;}
 raceId=race.id;const box=detailShell(`${race.year}年 ${race.name}`);
 box.append(el('p','総合順位は公式記録との照合前のため未表示です。総合タイムは暫定値で、タイム順の並びは公式順位を意味しません。','notice'));
 const nav=el('div','','race-tabs');box.append(nav);const content=el('div');box.append(content);
 let active='overall';
 const tr=data.team_results.filter(x=>x.race_id===raceId).sort((a,b)=>secs(a.overall_time)-secs(b.overall_time)||a.team_number-b.team_number);
 const perfs=data.performances.filter(p=>p.race_id===raceId);
 function renderRace(){nav.replaceChildren();content.replaceChildren();[['overall','総合成績'],['legs','区間成績'],['info','大会情報']].forEach(([id,label])=>{const b=el('button',label);b.type='button';b.setAttribute('aria-selected',String(active===id));b.onclick=()=>{active=id;renderRace()};nav.append(b)});
 if(active==='overall'){
  content.append(el('p','チーム名をクリックすると区間記録を表示します。','muted'));
  const wrap=el('div','','tablewrap'),table=el('table'),head=el('tr');['順位','チーム','総合タイム'].forEach(h=>head.append(el('th',h)));const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');
  tr.forEach(t=>{const row=el('tr'),rank=el('td',t.overall_rank??'—'),td=el('td'),b=el('button',nameBy(data.teams,t.team_id));b.type='button';b.setAttribute('aria-expanded','false');td.append(b);row.append(rank,td,el('td',t.overall_time?`${t.overall_time}（暫定）`:'—'));tbody.append(row);
   const exp=el('tr','','expand-row'),cell=el('td');cell.colSpan=3;const legs=perfs.filter(p=>p.team_race_id===t.id).sort((a,b)=>a.leg-b.leg);cell.append(linkedTable(['区間','選手','区間順位','区間タイム'],legs.map(p=>[`${p.leg}区`,athleteLink(p.athlete_id),p.leg_rank??'—',p.leg_time])));exp.append(cell);exp.hidden=true;tbody.append(exp);b.onclick=()=>{exp.hidden=!exp.hidden;b.setAttribute('aria-expanded',String(!exp.hidden))};
  });table.append(tbody);wrap.append(table);content.append(wrap);
 }else if(active==='legs'){
  const choose=el('label','区間を選択'),sel=el('select');for(let i=1;i<=8;i++){const o=el('option',`${i}区`);o.value=i;sel.append(o)}choose.append(sel);content.append(choose);const listing=el('div');content.append(listing);
  function showLeg(){listing.replaceChildren();const rows=perfs.filter(p=>p.leg===Number(sel.value)).sort((a,b)=>secs(a.leg_time)-secs(b.leg_time)||a.team_number-b.team_number);listing.append(linkedTable(['区間順位','選手','チーム','タイム'],rows.map(p=>[p.leg_rank??'—',athleteLink(p.athlete_id),teamLink(p.team_id),p.leg_time])))}sel.onchange=showLeg;showLeg();
 }else{
  content.append(el('p',`大会：${race.name}`));content.append(el('p',`年度：${race.year}年`));content.append(el('p',`出場チーム：${tr.length}チーム`));content.append(el('p',`収録区間記録：${perfs.length}件`));
  if(race.source_url){const p=el('p'),a=el('a','公式記録の出典を開く');a.href=race.source_url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);content.append(p)}
  content.append(el('p','開催日など未登録の項目は、公式資料との照合後に追加します。','muted'));
 }
 }renderRace();box.hidden=false;
}
function renderAthlete(id){
 const a=data.athletes.find(x=>String(x.id)===String(id));if(!a){showMissing();return;}id=a.id;const box=detailShell(a.name);
 box.append(el('p','同一人物の照合前の仮登録です。別年度の同姓同名記録は自動統合していません。','notice'));
 const rows=data.performances.filter(p=>p.athlete_id===id).sort((a,b)=>b.year-a.year||a.leg-b.leg);
 box.append(el('h3','駅伝出走記録'));
 box.append(linkedTable(['年度','大会','所属','区間','区間順位','区間タイム'],rows.map(p=>[p.year,raceLink(p.race_id,p.race),teamLink(p.team_id),`${p.leg}区`,p.leg_rank??'—',p.leg_time])));
 box.append(el('h3','個人種目・自己ベスト'));
 box.append(el('p','個人7種目の記録は未収録です。収集後に表示します。','hint'));
 box.append(el('h3','所属履歴・学年・年齢'));
 box.append(el('p','在籍期間・生年月日が未登録のため、確認できた大会出走時の所属のみを表示しています。','hint'));
 box.append(linkedTable(['年度','確認できた所属'],rows.map(p=>[p.year,teamLink(p.team_id)])));
 box.append(el('h3','同級生・先輩・後輩'));
 box.append(el('p','在籍年度の情報が整い次第、追加します。','hint'));
}
function renderTeam(id){
 const team=data.teams.find(x=>String(x.id)===String(id));if(!team){showMissing();return;}id=team.id;const box=detailShell(team.name);
 box.append(el('p',`区分：${team.category||'未確認'} ／ 所在地：未登録`,'muted'));
 const nav=el('div','','subtabs'),content=el('div');box.append(nav,content);let active='members';
 const rows=data.performances.filter(p=>p.team_id===id);
 const years=[...new Set(rows.map(p=>p.year))].sort((a,b)=>b-a);
 function draw(){nav.replaceChildren();content.replaceChildren();[['members','所属選手'],['ekiden','駅伝成績'],['records','チーム記録']].forEach(([key,label])=>{const b=el('button',label);b.type='button';b.setAttribute('aria-selected',String(active===key));b.onclick=()=>{active=key;draw()};nav.append(b)});
 if(active==='members'){
  const label=el('label','年度を選択'),sel=el('select');years.forEach(y=>{const o=el('option',`${y}年`);o.value=y;sel.append(o)});label.append(sel);content.append(label);
  const holder=el('div');content.append(holder);
  const renderYear=()=>{holder.replaceChildren();const subset=rows.filter(p=>p.year===Number(sel.value)).sort((a,b)=>a.leg-b.leg);holder.append(el('p','対象年度に大会出走が確認できた選手のみ表示しています。登録名簿ではありません。','hint'));holder.append(linkedTable(['選手','学年','大会','出走区間・区間順位'],subset.map(p=>[athleteLink(p.athlete_id),'—',raceLink(p.race_id,p.race),`${p.leg}区 ${p.leg_rank??'—'}位`])))};
  sel.onchange=renderYear;renderYear();
 }else if(active==='ekiden'){
  const trs=data.team_results.filter(t=>t.team_id===id).sort((a,b)=>b.year-a.year);
  content.append(el('p','現在収録している大会のみ掲載。過去の不出場年は、出場履歴の整備後に表示します。','hint'));
  content.append(linkedTable(['年度','大会','総合順位','総合タイム'],trs.map(t=>[t.year,raceLink(t.race_id,t.race),t.overall_rank??'—',t.overall_time?`${t.overall_time}（暫定）`:'—'])));
 }else{
  content.append(el('p','個人7種目の公認記録を収集した段階で、在籍期間中の種目別ランキングを表示します。','hint'));
  content.append(el('p','※各選手の在籍期間中における種目別ベストタイムのみを掲載しています。','hint'));
 }
 }draw();
}
async function init(){try{
 const names=['athletes','teams','races','performances','team_results'];const values=await Promise.all(names.map(async name=>{const r=await fetch(`./public_data/${name}.json`);if(!r.ok)throw Error(`${name}.json を取得できません (${r.status})`);return r.json()}));names.forEach((n,i)=>data[n]=values[i]);
 [...new Set(data.races.map(r=>r.name))].forEach(n=>{const o=el('option',n);o.value=n;$('race').append(o)});
 [...new Set(data.races.map(r=>r.year))].sort((a,b)=>b-a).forEach(y=>{const o=el('option',y);o.value=y;$('year').append(o)});
 search();
 view=parseHash();history.replaceState({view,scrollY:0},'',location.href);
 drawView();if(view.kind!=='search')window.scrollTo(0,0);
 }catch(e){$('status').textContent=`読み込みに失敗しました：${e.message}`;document.querySelectorAll('button').forEach(b=>b.disabled=true);}}
$('form').addEventListener('submit',e=>{e.preventDefault();route({kind:'search'});search()});
$('reset').addEventListener('click',()=>{$('form').reset();route({kind:'search'});search()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;limit=20;route({kind:'search'});render()}));
$('more').addEventListener('click',()=>{limit+=20;render()});
window.addEventListener('popstate',e=>{
 restoring=true;view=e.state?.view||parseHash();drawView();
 if(view.kind==='search')requestAnimationFrame(()=>window.scrollTo(0,e.state?.scrollY||0));
 else window.scrollTo(0,0);
 restoring=false;
});
init();
</script></body></html>
